name: Refresh data and deploy

on:
  schedule:
    - cron: '30 14 * * *' # daily, after the EPSS (~13:00 UTC) and NVD feed updates
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .cache
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-
      - run: node --test scripts/indexnow.test.mjs
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: python etl/build.py
      - run: npm run build
      - id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.157.0'
          command: deploy
      - name: Restore IndexNow submission state
        if: steps.publish.outcome == 'success'
        uses: actions/cache/restore@v6
        with:
          path: .indexnow/state.json
          key: indexnow-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-${{ github.ref_name }}-
      - name: Submit changed pages to Bing IndexNow
        if: steps.publish.outcome == 'success'
        run: node scripts/indexnow.mjs
      - name: Save IndexNow submission state
        if: success() && steps.publish.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .indexnow/state.json
          key: indexnow-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Bing receipt
        if: always() && steps.publish.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: indexnow-receipt
          path: .indexnow/receipt.json
          if-no-files-found: ignore
